name: Deploy Berliner to GitHub Pages

on:
  push:
    branches:
      - main

  schedule:
    - cron: '23 5 * * *'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'schedule' || vars.ENABLE_OSM_UPDATES == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore OSM download cache
        if: vars.ENABLE_OSM_UPDATES == 'true'
        uses: actions/cache@v4
        with:
          path: .catalog-cache
          key: berlin-osm-${{ runner.os }}-${{ github.run_id }}
          restore-keys: berlin-osm-${{ runner.os }}-

      - name: Refresh catalog from the latest Berlin extract
        if: vars.ENABLE_OSM_UPDATES == 'true'
        run: |
          python3 -m venv .catalog-venv
          .catalog-venv/bin/pip install -r scripts/catalog-requirements.txt
          .catalog-venv/bin/python scripts/build_catalog.py

      - name: Test imports and catalog
        run: npm test

      - name: Check link resolver
        run: npm run check:worker

      - name: Build application
        env:
          VITE_MAPS_RESOLVER_URL: ${{ vars.VITE_MAPS_RESOLVER_URL }}
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
